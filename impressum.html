<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impressum — TagChatNotes</title>
  <meta name="description" content="Impressum und Anbieterkennzeichnung nach § 5 DDG." />

  <!-- Preconnect for faster font loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* Same design tokens as index.html — keep them in sync */
    :root {
      --bg: #faf7f2;
      --ink: #1a1a1a;
      --ink-soft: #555;
      --accent: #6c5ce7;
      --accent-soft: #a29bfe;
      --rule: #e8e2d6;
      --max-width: 680px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin: 0 0 0.5em 0;
    }
    h2 {
      font-size: 1.15rem;
      margin-top: 2em;
      margin-bottom: 0.5em;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ---------- Header ---------- */
    header {
      padding: 32px 0;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 1.05rem;
    }
    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.1rem;
    }

    /* ---------- Content ---------- */
    main {
      padding: 32px 0 64px;
    }
    main h1 {
      font-size: 2.25rem;
      margin-bottom: 32px;
    }

    .block {
      margin-bottom: 1em;
    }
    .block p {
      margin: 0.2em 0;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    a:hover {
      border-bottom-color: var(--accent);
    }

    .small {
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin-top: 3em;
    }

    /* ---------- Footer ---------- */
    footer {
      padding: 48px 0 32px;
      border-top: 1px solid var(--rule);
      margin-top: 48px;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }
    footer nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 16px;
    }
    footer a {
      color: var(--ink-soft);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    footer a:hover {
      border-bottom-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ========== Header ========== -->
    <header>
      <a href="index.html" class="logo">
        <span class="logo-mark">#</span>
        TagChatNotes
      </a>
    </header>

    <!-- ========== Impressum content ========== -->
    <main>
      <h1>Impressum</h1>

      <h2>Angaben gemäß § 5 DDG</h2>
      <div class="block">
        <p>Tuan Thanh Truong</p>
        <p>Mathilde-Maier-Str. 2</p>
        <p>60326 Frankfurt am Main</p>
        <p>Deutschland</p>
      </div>

      <h2>Kontakt</h2>
      <div class="block">
        <p>E-Mail: <a href="mailto:ttt.studio.dev@gmail.com">ttt.studio.dev@gmail.com</a></p>
      </div>

      <p class="small">Stand: [April 2026]</p>
    </main>

    <!-- ========== Footer ========== -->
    <footer>
      <nav>
        <a href="index.html">Home</a>
        <a href="support.html">Support</a>
        <a href="impressum.html">Impressum</a>
        <a href="tagchatnotes-privacy-policy.html">Datenschutz / Privacy Policy</a>
      </nav>
      <p>© 2026 Tuan Thanh Truong. All rights reserved.</p>
    </footer>

  </div>
</body>
</html>
